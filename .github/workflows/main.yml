name: Atualizar publicações

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar ORCID e OpenAlex
        env:
          OPENALEX_MAILTO: gerlanmatfis@gmail.com
        run: node scripts/collect-publications.mjs

      - name: Validar o projeto
        run: npm ci && npm run build

      - name: Salvar dados atualizados
        run: |
          git config user.name "ppge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/artigos.json public/data/artigos.csv public/data/metricas.json
          git diff --cached --quiet || git commit -m "Atualiza publicações do PPGE"
          git push
